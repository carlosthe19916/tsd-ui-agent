networks:
  app:

volumes:
  postgres-data:

services:
  db:
    image: ${POSTGRESQL_IMAGE}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tsd_ui_agent
    ports:
      - "5432:5432"
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tsd_ui_agent"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ${BACKEND_IMAGE}
    environment:
      QUARKUS_DATASOURCE_USERNAME: postgres
      QUARKUS_DATASOURCE_PASSWORD: postgres
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://db:5432/tsd_ui_agent
    ports:
      - "8080:8080"
    networks:
      - app
    depends_on:
      db:
        condition: service_healthy

  ui:
    image: ${UI_IMAGE}
    environment:
      TSD_API_URL: http://backend:8080
    ports:
      - "8081:8080"
    networks:
      - app
    depends_on:
      backend:
        condition: service_started

  playwright:
    image: mcr.microsoft.com/playwright:v1.58.2-jammy
    ports:
      - "5000:5000"
    network_mode: host
    working_dir: /home/pwuser
    command:
      - /bin/sh
      - -c
      - npx -y playwright@1.58.2 run-server --port 5000
