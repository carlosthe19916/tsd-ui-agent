quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.sql-load-script=import.sql

tsd-agent.git.base-dir=${java.io.tmpdir}/tsd-agent-ui-test

# Disable MCP sources in tests
tsd-agent.discovery.ai.enabled=true
tsd-agent.discovery.github-mcp.enabled=false
tsd-agent.discovery.jira-mcp.enabled=false

# Disable MCP server startup in tests
quarkus.langchain4j.mcp.github.disabled=true
quarkus.langchain4j.mcp.jira.disabled=true
