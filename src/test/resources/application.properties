quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
quarkus.datasource.devservices.enabled=false

quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.sql-load-script=import.sql
quarkus.flyway.active=false

tsd-agent.git.base-dir=${java.io.tmpdir}/tsd-agent-ui-test
tsd-agent.coding-agent=CLAUDE
tsd-agent.claude.command=claude
tsd-agent.opencode.command=opencode
tsd-agent.claude.model=sonnet
tsd-agent.opencode.model=anthropic/claude-sonnet-4-6

# Suppress expected noise during tests (async provisioning errors, DiscoveryService scanning non-existent dirs)
quarkus.log.category."org.acme.services.devcontainer.DiscoveryService".level=OFF
quarkus.log.category."org.acme.services.WorkspaceService".level=OFF

# Disable GitHub App in tests (clear dummy values from main config)
quarkus.github-app.app-id=
quarkus.github-app.private-key=
quarkus.github-app.webhook-secret=

# LangChain4j: provide dummy key so the extension starts in tests
quarkus.langchain4j.ai.gemini.api-key=test-dummy-key
quarkus.langchain4j.ai.gemini.enable-integration=false
