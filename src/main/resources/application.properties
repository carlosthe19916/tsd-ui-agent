# PostgreSQL datasource
quarkus.datasource.db-kind=postgresql

# Hibernate ORM — auto-create tables from entities
quarkus.hibernate-orm.database.generation=update

# Git clone base directory
tsd-agent.git.base-dir=${HOME}/.tsd-agent-ui/repositories

# Discovery AI
tsd-agent.discovery.ai.enabled=${DISCOVERY_AI_ENABLED:true}

# LLM Configuration (OpenAI-compatible - works with Ollama, OpenAI, vLLM)
quarkus.langchain4j.openai.base-url=http://localhost:11434/v1
quarkus.langchain4j.openai.api-key=not-needed
quarkus.langchain4j.openai.chat-model.model-name=granite3.3:8b
quarkus.langchain4j.openai.chat-model.temperature=0.3
quarkus.langchain4j.openai.timeout=120s
quarkus.langchain4j.openai.chat-model.max-tokens=4096

# MCP Server: GitHub
quarkus.langchain4j.mcp.github.transport-type=stdio
quarkus.langchain4j.mcp.github.command=npx
quarkus.langchain4j.mcp.github.arguments=-y,@modelcontextprotocol/server-github
quarkus.langchain4j.mcp.github.environment.GITHUB_PERSONAL_ACCESS_TOKEN=${GITHUB_TOKEN:none}

# MCP Server: Jira (Atlassian)
quarkus.langchain4j.mcp.jira.transport-type=stdio
quarkus.langchain4j.mcp.jira.command=npx
quarkus.langchain4j.mcp.jira.arguments=-y,@modelcontextprotocol/server-atlassian
quarkus.langchain4j.mcp.jira.environment.ATLASSIAN_API_TOKEN=${JIRA_TOKEN:none}
quarkus.langchain4j.mcp.jira.environment.ATLASSIAN_URL=${JIRA_URL:https://localhost}
quarkus.langchain4j.mcp.jira.environment.ATLASSIAN_EMAIL=${JIRA_EMAIL:none}
