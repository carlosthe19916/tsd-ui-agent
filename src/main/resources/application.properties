# PostgreSQL datasource
quarkus.datasource.db-kind=postgresql

# Hibernate ORM - auto-create tables from entities
quarkus.hibernate-orm.database.generation=update

# Git clone base directory
tsd-agent.git.base-dir=${HOME}/.tsd-agent-ui

# Execution mode: FILESYSTEM, DOCKER, KUBERNETES
tsd-agent.execution-mode=DOCKER

# Discovery AI
tsd-agent.discovery.ai.enabled=${DISCOVERY_AI_ENABLED:true}

# Command to open VSCode
tsd-agent.vscode.command=code

# Command to open a terminal. Use %s as placeholder for the working directory.
# Fedora/GNOME: ptyxis --new-window -d %s | GNOME Terminal: gnome-terminal --working-directory=%s
tsd-agent.terminal.command=ptyxis --new-window -d %s

# Command to open a terminal and run a command. Use %s for dir and %c for command.
tsd-agent.terminal.exec-command=ptyxis -d %s -x %c

# Claude CLI binary name
tsd-agent.claude.command=claude

# LLM Configuration

# Dev (default) - Ollama via OpenAI-compatible API
quarkus.langchain4j.openai.base-url=http://localhost:11434/v1
quarkus.langchain4j.openai.api-key=ollama #any_value_works
quarkus.langchain4j.openai.chat-model.model-name=granite3.3:8b
quarkus.langchain4j.openai.chat-model.temperature=0.3
quarkus.langchain4j.openai.timeout=120s
quarkus.langchain4j.openai.chat-model.max-completion-tokens=4096

# Prod - Anthropic Claude
#%prod.quarkus.langchain4j.anthropic.api-key=${ANTHROPIC_API_KEY}
#%prod.quarkus.langchain4j.anthropic.chat-model.model-name=claude-sonnet-4-20250514
#%prod.quarkus.langchain4j.anthropic.chat-model.temperature=0.3
#%prod.quarkus.langchain4j.anthropic.timeout=120s
#%prod.quarkus.langchain4j.anthropic.chat-model.max-tokens=4096

# Select active provider per profile
quarkus.langchain4j.chat-model.provider=openai
#%prod.quarkus.langchain4j.chat-model.provider=anthropic

# Disable inactive provider per profile
#%prod.quarkus.langchain4j.openai.enable-integration=false
%dev.quarkus.langchain4j.anthropic.enable-integration=false
%test.quarkus.langchain4j.anthropic.enable-integration=false

quarkus.langchain4j.log-requests=true
quarkus.langchain4j.log-responses=true

# Trust all SSL certificates for Camel HTTP routes (e.g. internal GitLab with corporate CA)
tsd-agent.http.trust-all-ssl=true

# TLS configuration for GitLab REST client (self-hosted with untrusted certs)
quarkus.tls.trust-all=true

# Devcontainer CLI configuration (Docker execution mode)
tsd-agent.devcontainer.command=devcontainer
tsd-agent.devcontainer.image=mcr.microsoft.com/devcontainers/base:ubuntu
tsd-agent.devcontainer.env-passthrough=ANTHROPIC_API_KEY

# Kubernetes configuration (Eclipse Che / DevWorkspace)
tsd-agent.kubernetes.command=kubectl
tsd-agent.kubernetes.namespace=tsd-agent-workspaces
tsd-agent.kubernetes.image=mcr.microsoft.com/devcontainers/base:ubuntu
tsd-agent.kubernetes.working-dir=/projects/project
tsd-agent.kubernetes.env-passthrough=ANTHROPIC_API_KEY
#tsd-agent.kubernetes.che-url=https://che.example.com

quarkus.docker.docker-host=unix:///run/user/115091/podman/podman.sock