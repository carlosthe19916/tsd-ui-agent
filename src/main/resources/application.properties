# REST API prefix
quarkus.rest.path=/api

# TLS configuration for GitLab REST client (self-hosted with untrusted certs)
quarkus.tls.trust-all=true

# Qute
quarkus.qute.suffixes=qute.html,qute.txt,html,txt,yaml

# PostgreSQL datasource
quarkus.datasource.db-kind=postgresql

# Database schema management (per-profile)
# Dev: Hibernate auto-updates schema from entities (no Flyway, no manual SQL)
%dev.quarkus.hibernate-orm.schema-management.strategy=update
%dev.quarkus.flyway.active=false

# Prod: Flyway manages schema, Hibernate only validates entity/schema match
%prod.quarkus.hibernate-orm.schema-management.strategy=validate
%prod.quarkus.flyway.migrate-at-start=true
%prod.quarkus.flyway.baseline-on-migrate=true
%prod.quarkus.flyway.baseline-version=0

# H2 file-based profile (standalone release, no external PostgreSQL needed)
%h2.quarkus.datasource.db-kind=h2
%h2.quarkus.datasource.jdbc.url=jdbc:h2:file:${user.home}/.tsd-agent-ui/db;AUTO_SERVER=TRUE;MODE=PostgreSQL
%h2.quarkus.hibernate-orm.schema-management.strategy=validate
%h2.quarkus.flyway.migrate-at-start=true
%h2.quarkus.flyway.baseline-on-migrate=true
%h2.quarkus.flyway.baseline-version=0

# Git clone base directory
tsd-agent.git.base-dir=${HOME}/.tsd-agent-ui
tsd-agent.git.user-name=tsd-agent
tsd-agent.git.user-email=tsd-agent@noreply

# Claude CLI binary name
tsd-agent.claude.command=claude
tsd-agent.claude.model=opus

tsd-agent.opencode.command=opencode
tsd-agent.opencode.model=google-vertex-anthropic/claude-opus-4-6@default

# Devcontainer CLI configuration (Docker execution mode)
tsd-agent.devcontainer.command=devcontainer
tsd-agent.devcontainer.image=mcr.microsoft.com/devcontainers/base:ubuntu
tsd-agent.devcontainer.remote-user=vscode

# Coding agent to install in workspaces: CLAUDE or OPENCODE
tsd-agent.coding-agent=CLAUDE

tsd-agent.devcontainer.claude.post-create-command=sudo chown vscode:vscode /home/vscode/.claude && curl -fsSL https://claude.ai/install.sh | bash && sudo ln -sf /home/vscode/.local/bin/claude /usr/local/bin/claude && echo '{"hasCompletedOnboarding":true,"theme":"dark"}' > /home/vscode/.claude.json
tsd-agent.devcontainer.claude.env-passthrough=CLAUDE_CODE_USE_VERTEX,ANTHROPIC_VERTEX_PROJECT_ID,CLOUD_ML_REGION,GOOGLE_CLOUD_PROJECT,GOOGLE_APPLICATION_CREDENTIALS
tsd-agent.devcontainer.claude.mounts.gcloud=source=${HOME}/.config/gcloud/application_default_credentials.json,target=/home/vscode/.config/gcloud/application_default_credentials.json,type=bind,readonly

tsd-agent.devcontainer.opencode.post-create-command=sudo chown vscode:vscode /home/vscode/.opencode && curl -fsSL https://opencode.ai/install | bash && sudo ln -sf /home/vscode/.opencode/bin/opencode /usr/local/bin/opencode
tsd-agent.devcontainer.opencode.env-passthrough=CLAUDE_CODE_USE_VERTEX,ANTHROPIC_VERTEX_PROJECT_ID,CLOUD_ML_REGION,GOOGLE_CLOUD_PROJECT,GOOGLE_APPLICATION_CREDENTIALS
tsd-agent.devcontainer.opencode.mounts.gcloud=source=${HOME}/.config/gcloud/application_default_credentials.json,target=/home/vscode/.config/gcloud/application_default_credentials.json,type=bind,readonly

tsd-agent.devcontainer.port-range-start=13000
tsd-agent.devcontainer.port-range-end=13099

# Kubernetes configuration (Eclipse Che / DevWorkspace)
tsd-agent.kubernetes.namespace=kubeadmin-che
tsd-agent.kubernetes.image=quay.io/devfile/universal-developer-image:ubi8-latest
tsd-agent.kubernetes.working-dir=/projects/project
tsd-agent.kubernetes.env-passthrough=ANTHROPIC_API_KEY
tsd-agent.kubernetes.routing-class=che
tsd-agent.kubernetes.devworkspace-config-namespace=eclipse-che
tsd-agent.kubernetes.che-code-image=quay.io/che-incubator/che-code:latest
tsd-agent.kubernetes.che-url=https://192.168.39.120.nip.io

quarkus.kubernetes-client.devservices.enabled=false
tsd-agent.devcontainer.container-runtime=podman

# Native build: defer pty4j class initialization to runtime (JNI + OS detection)
%native.quarkus.native.additional-build-args=--initialize-at-run-time=com.pty4j