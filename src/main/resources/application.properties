# PostgreSQL datasource
quarkus.datasource.db-kind=postgresql

# Hibernate ORM — auto-create tables from entities
quarkus.hibernate-orm.database.generation=update

# Production datasource (set via env vars: QUARKUS_DATASOURCE_JDBC_URL, QUARKUS_DATASOURCE_USERNAME, QUARKUS_DATASOURCE_PASSWORD)
%prod.quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/tsd_ui_agent}
%prod.quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:postgres}
%prod.quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:postgres}
