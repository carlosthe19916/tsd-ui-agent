name: CI (e2e)

on:
  push:
    branches:
      - "main"
      - "release/*"
  pull_request:
    branches:
      - "main"
      - "release/*"
  workflow_call:
  merge_group:

concurrency:
  group: ci-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-upload-for-e2e-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin
          cache: maven

      - name: save tsd-ui-agent-ui image
        run: |
          docker build ui/ -t ghcr.io/${{ github.repository_owner }}/tsd-ui-agent-ui:pr-test -f ui/Dockerfile

      - name: save tsd-ui-agent image
        run: |
          ./mvnw -U -B package --file pom.xml -DskipTests \
          -Dquarkus.container-image.build=true \
          -Dquarkus.container-image.push=false \
          -Dquarkus.container-image.registry=ghcr.io \
          -Dquarkus.container-image.group=${{ github.repository_owner }} \
          -Dquarkus.container-image.name=tsd-ui-agent \
          -Dquarkus.container-image.tag=pr-test

      - name: save images
        run: |
          docker save -o /tmp/tsd-ui-agent-images.tar \
            ghcr.io/${{ github.repository_owner }}/tsd-ui-agent-ui:pr-test \
            ghcr.io/${{ github.repository_owner }}/tsd-ui-agent:pr-test

      - name: Upload images as artifact
        uses: actions/upload-artifact@v7
        with:
          name: tsd-ui-agent-images
          path: /tmp/tsd-ui-agent-images.tar
          retention-days: 1

  run-e2e-ci:
    needs:
      - build-and-upload-for-e2e-ci
    uses: ./.github/workflows/ci-e2e-template.yaml
    with:
      artifact: tsd-ui-agent-images
      ui_image: ghcr.io/${{ github.repository_owner }}/tsd-ui-agent-ui:pr-test
      server_image: ghcr.io/${{ github.repository_owner }}/tsd-ui-agent:pr-test
