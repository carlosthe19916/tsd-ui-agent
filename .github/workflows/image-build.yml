name: Multiple Architecture Image Build

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "release/*"
    tags:
      - "v*"

concurrency:
  group: image-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-image-build:
    uses: guacsec/trustify-release-tools/.github/workflows/build-push-images.yaml@main
    with:
      registry: "ghcr.io"
      image_name: "${{ github.repository_owner }}/tsd-ui-agent"
      containerfile: "./Dockerfile"
      architectures: '[ "amd64" ]'
    secrets:
      registry_username: ${{ github.actor }}
      registry_password: ${{ secrets.GITHUB_TOKEN }}

  ui-image-build:
    uses: guacsec/trustify-release-tools/.github/workflows/build-push-images.yaml@main
    with:
      registry: "ghcr.io"
      image_name: "${{ github.repository_owner }}/tsd-ui-agent-ui"
      containerfile: "./ui/Dockerfile"
      architectures: '[ "amd64" ]'
      extra-args: "--ulimit nofile=4096:4096"
      context: "ui/"
    secrets:
      registry_username: ${{ github.actor }}
      registry_password: ${{ secrets.GITHUB_TOKEN }}
